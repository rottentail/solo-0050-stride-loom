<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10171b">
  <title>折步台 · 动作状态机工作台</title>
  <link rel="stylesheet" href="/stride/static/shell.css">
  <link rel="stylesheet" href="/stride/static/studio.css">
  <script type="module" src="/stride/static/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="identity"><span class="brand-mark" aria-hidden="true"></span><div><h1>折步台</h1><span>动作状态机工作台</span></div></div>
    <nav aria-label="工作区视图">
      <button data-page="stage" aria-current="page">动作预演</button>
      <button data-page="source">源资料</button>
      <button data-page="revisions">修订与交接</button>
    </nav>
    <div class="working"><span id="revision">修订载入中</span><button id="save" class="primary">保存修订</button></div>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section id="stage" class="workbench">
      <aside class="panel controls" aria-labelledby="scene-title">
        <h2 id="scene-title">预演场景</h2>
        <label for="scene">当前场景</label><select id="scene"></select>
        <div class="split"><label>总拍数 <input type="number" id="ticks" min="1" max="240"></label><label>推进速度 <select id="speed"><option value="1">1 源帧／拍</option><option value="2">2 源帧／拍</option></select></label></div>
        <label class="mirror-toggle"><input type="checkbox" id="mirror">水平镜像</label>
        <div class="rule"></div>
        <label for="inputs">输入轨</label><textarea id="inputs" rows="7" spellcheck="false" aria-describedby="command-hint"></textarea>
        <small id="command-hint"></small>
        <div class="action-stack"><button id="run" class="primary">运行预演</button><button id="compare">与另一场景比较</button><select id="compare-scene" aria-label="比较场景"></select></div>
      </aside>
      <section class="panel viewport" aria-labelledby="view-heading">
        <div class="viewport-title"><div><span class="subtle" id="graph-title">世界坐标</span><h2 id="view-heading">姿态与根轨</h2></div><span class="mono" id="pose-tag">待预演</span></div>
        <canvas id="picture" role="img" aria-label="当前拍的角色骨架和根位移路径"></canvas>
        <div class="legend"><span><i class="dot mint"></i>当前姿态</span><span><i class="dot sand"></i>已走根轨</span><span id="world">—</span></div>
        <div class="transport"><button id="play" aria-label="播放">播放</button><button id="prev" aria-label="上一拍">←</button><button id="next" aria-label="下一拍">→</button><input id="playhead" type="range" min="0" max="0" value="0" aria-label="预演拍点"><output id="beat">00 / 00</output></div>
      </section>
      <aside class="panel inspector" aria-labelledby="inspector-title">
        <h2 id="inspector-title">拍点检查</h2><div id="facts"></div>
        <h3>帧事件</h3><div id="marks"></div>
        <h3>候选转场</h3><div id="gates"></div>
        <h3>缓冲中的命令</h3><div id="pending"></div>
      </aside>
      <section class="panel timeline" aria-labelledby="timeline-heading">
        <div class="timeline-top"><h2 id="timeline-heading">逐拍时间轴</h2><div class="legend"><span><i class="dot mint"></i>转场</span><span><i class="dot sand"></i>帧事件</span></div></div>
        <div id="beats" tabindex="0" aria-label="所有预演拍点"></div>
        <div class="comparison" id="comparison" hidden><p id="difference"></p><button id="comparison-side" type="button">查看对照</button></div>
      </section>
    </section>
    <section id="source" class="panel alternate" hidden>
      <div class="section-heading"><div><h2>源资料</h2><p>直接编辑根轨、姿态与动作边，预检后返回预演。</p></div><button id="validate" class="primary">预检并应用</button></div>
      <textarea id="json" aria-label="动作图 JSON" spellcheck="false"></textarea>
    </section>
    <section id="revisions" class="panel alternate" hidden>
      <div class="section-heading"><div><h2>修订与交接</h2><p>取回任一已保存修订，或打开可独立复演的动作资料。</p></div><button id="refresh">刷新修订</button></div>
      <div class="delivery-grid"><section><h3>修订谱系</h3><div id="history"></div></section><section><h3>交接包</h3><p>下载时使用已选修订中的原始场景。</p><button id="download" class="primary">下载交接包</button><label for="upload">打开本地交接包</label><input type="file" id="upload" accept="application/json,.json"><div class="upload-controls"><button id="verify">校验交接包</button><button id="rehearse">校验并重播</button></div></section></div>
    </section>
  </main>
</body>
</html>
